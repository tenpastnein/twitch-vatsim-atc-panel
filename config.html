<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Configure VATSIM CID</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="title">Configure VATSIM CID</div>

    <label class="label" for="cidInput">VATSIM Member ID (CID)</label>
    <input id="cidInput" class="input" inputmode="numeric" placeholder="e.g. 1234567" />

    <label class="label" for="limitSelect">How many sessions to show</label>
    <select id="limitSelect" class="input">
    <option value="5">5 (most recent)</option>
    <option value="10">10 (most recent)</option>
    </select>

    <div class="row">
      <button id="saveBtn" class="btn">Save</button>
      <span id="saveStatus" class="status"></span>
    </div>

    <p class="hint">
      This is stored per-channel via Twitch’s configuration service.
    </p>
  </div>

  <script src="common.js"></script>
  <script src="config.js"></script>
</body>
</html>
